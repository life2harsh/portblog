[package]
name = "ssh-portfolio"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "ssh-portfolio"
path = "src/main.rs"

[dependencies]
content = { path = "../../crates/content" }
art = { path = "../../crates/art", default-features = false }
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
