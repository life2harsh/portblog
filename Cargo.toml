[workspace]
members = [
    "apps/portfolio",
    "apps/blog",
    "crates/ui",
    "crates/content",
    "crates/art",
    "apps/api",
    "apps/ssh",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["life2harsh"]
license = "MIT"

[workspace.dependencies]
dioxus = { version = "=0.7.0", features = ["web", "router"] }
dioxus-router = { version = "=0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.2"
gloo-events = "0.2"
log = "0.4"
console_log = { version = "1", features = ["color"] }

[workspace.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Storage",
    "History",
    "ScrollRestoration",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AnalyserNode",
    "AudioDestinationNode",
    "MediaElementAudioSourceNode",
    "ImageData",
    "HtmlMetaElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DomRect",
    "MediaQueryList",
    "Performance",
    "VisibilityState",
    "KeyboardEvent",
    "EventTarget",
    "Event",
    "console",
]
