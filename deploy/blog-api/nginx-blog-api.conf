server {
    listen 443 ssl;
    server_name blog-api.life2harsh.xyz;

    ssl_certificate /etc/letsencrypt/live/blog-api.life2harsh.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-api.life2harsh.xyz/privkey.pem;

    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:7841;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
